# 矿业新闻日报 · AI 问答代理（纯边缘函数，无构建步骤、无站点文件）
# Key 不在这里，也不在代码里 —— 只在 Netlify 站点环境变量 DEEPSEEK_API_KEY 中。

[build]
  publish = "public"      # 空目录占位，本站点只提供 API，不托管页面
  command = ""            # 无需构建

[[edge_functions]]
  function = "qa"
  path = "/api/*"

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
