<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矿业新闻日报 · 已迁移新地址</title>
<style>
  :root{
    --accent:#4f46e5; --accent-d:#4338ca;
    --bg:#eef2f7; --card:#fff; --ink:#1f2937; --sub:#6b7a89; --line:#e5e9f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#eef2f7,#e3e9f2);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);max-width:480px;width:100%;border-radius:16px;
    box-shadow:0 10px 40px rgba(31,41,55,.10);overflow:hidden}
  .head{background:linear-gradient(135deg,var(--accent),#6d5be0);color:#fff;padding:26px 24px}
  .head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
    padding:4px 10px;border-radius:999px;font-size:12px;margin-bottom:10px}
  .head h1{font-size:20px;font-weight:700;line-height:1.3}
  .body{padding:22px 24px}
  .body p{color:var(--sub);font-size:14.5px;line-height:1.7;margin-bottom:14px}
  .body p b{color:var(--ink)}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    padding:13px 16px;border-radius:10px;transition:.15s}
  .btn:hover{background:var(--accent-d)}
  .meta{margin-top:14px;font-size:12.5px;color:var(--sub);text-align:center;line-height:1.6}
  .meta a{color:var(--accent);font-weight:600;text-decoration:none}
  .newlink{margin-top:6px;word-break:break-all}
  .newlink code{background:#f1f4f9;padding:2px 6px;border-radius:5px;color:#374151;font-size:12px}
  footer{background:#f7f9fc;border-top:1px solid var(--line);padding:12px 24px;
    font-size:11.5px;color:#9aa7b4;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="badge">⚠️ 旧地址内容已停用</span>
      <h1>矿业新闻日报 · 已迁移至新地址</h1>
    </div>
    <div class="body">
      <p>您访问的是 <b>旧地址</b>。该地址上的<b>旧版新闻内容已停止维护、不再更新，也不再展示</b>。</p>
      <p>最新、完整的矿业新闻日报，请前往<b>新地址</b>查看：</p>
      <a class="btn" id="goBtn" href="https://pliucugb-cyber.github.io/mining-daily/" target="_blank" rel="noopener">前往新版（GitHub Pages）↗</a>
      <div class="meta">
        将在 <span id="cd">6</span> 秒后自动跳转…
        <a href="https://pliucugb-cyber.github.io/mining-daily/">立即前往</a>
        <div class="newlink">新地址：<code>pliucugb-cyber.github.io/mining-daily</code></div>
      </div>
    </div>
    <footer>如曾将此页“添加到主屏幕”（PWA），我们会一并清理旧缓存，确保打开即是最新内容。</footer>
  </div>
<script>
(function(){
  var NEW = "https://pliucugb-cyber.github.io/mining-daily/";
  var left = 6, finished = false, timer = null;
  var cd = document.getElementById('cd');
  timer = setInterval(function(){
    left--;
    if (cd) cd.textContent = left;
    if (left <= 0) { clearInterval(timer); jump(); }
  }, 1000);

  function jump(){
    if (finished) return;
    finished = true;
    clearInterval(timer);
    // 旧站点可能注册过 Service Worker / 被装成 PWA，主动注销并清空缓存，避免旧内容“复活”。
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(r){ try { r.unregister(); } catch(e){} });
        }).catch(function(){});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function(ks){
          ks.forEach(function(k){ try { caches.delete(k); } catch(e){} });
        }).catch(function(){});
      }
    } catch(e) {}
    setTimeout(function(){ window.location.href = NEW; }, 350);
  }

  var goBtn = document.getElementById('goBtn');
  if (goBtn) goBtn.addEventListener('click', function(ev){ ev.preventDefault(); jump(); });
})();
</script>
</body>
</html>
