# 腾讯云 SCF 一键部署配置（Serverless Framework）
# 用法：在 scf/ 目录下执行 sls deploy
# 注意：腾讯云旧 API 网关已停止新建，本配置改用函数 URL（scfUrl）。
#      如果 sls deploy 报错，请改用控制台手动创建（见 README.md）。
service: mining-daily-qa

provider:
  name: tencent
  runtime: Python3.10

plugins:
  - serverless-tencent-scf

functions:
  qa:
    handler: index.main_handler
    runtime: Python3.10
    timeout: 30
    memorySize: 128
    environment:
      DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY}
    events:
      - scfUrl:
          enable: true
          authType: NONE
          cors:
            accessControlAllowOrigin: '*'
            accessControlAllowMethods: GET,POST,OPTIONS
            accessControlAllowHeaders: Content-Type
