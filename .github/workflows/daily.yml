# 矿业日报 — GitHub Actions 定时抓取
#
# 阶段一（当前）：只跑「抓取」，产出候选池，推到 draft/fetch 分支。
#   → 不生成页面、不部署、不碰 gh-pages、不碰 main。
#   → 目的：积累数日运行数据，观察稳定性（尤其国内信源在境外服务器上的可达性）。
#
# 手动触发：GitHub → Actions → 本 workflow → Run workflow
# 定时触发：每天北京时间 06:15（= UTC 22:15 前一天）
#   ⚠️ 刻意与 WorkBuddy 旧任务的 06:00 错开 15 分钟，避免两条链路同时打对方服务器。
#
# 依赖说明：所有脚本均为纯 Python 标准库，无需 pip install。

name: 矿业日报·抓取（阶段一）

on:
  # 手动触发（随时可补跑 / 复验）
  workflow_dispatch:
    inputs:
      report_date:
        description: '报告日期 YYYY-MM-DD（留空 = 今天）'
        required: false
        default: ''
  # 定时触发：每天北京时间 06:15
  schedule:
    - cron: '15 22 * * *'   # UTC 22:15 = 北京时间 06:15（次日）

# 只读仓库内容；写权限仅用于推 draft 分支
permissions:
  contents: write

# 同一时间只允许一个抓取实例，避免并发写 draft 打架
concurrency:
  group: mining-daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # LME 行情 token：来自仓库 Secrets，切勿写死在文件里
      # 配置位置：仓库 Settings → Secrets and variables → Actions → New repository secret
      # 名称必须是 LME_TOKEN，值从本机 lme_token.txt 取
      LME_TOKEN: ${{ secrets.LME_TOKEN }}
      # 统一时区，保证日期判定与本地一致（北京时间）
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 确认 Python 环境
        run: |
          python3 --version
          echo "--- 工作目录 ---"
          pwd
          ls -1 *.py | head -20

      - name: 确定报告日期
        id: date
        run: |
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            D="${{ github.event.inputs.report_date }}"
          else
            D="$(date +%Y-%m-%d)"
          fi
          echo "report_date=$D" >> "$GITHUB_OUTPUT"
          echo "报告日期：$D"

      - name: 前置健康检查（不中断，仅记录）
        continue-on-error: true
        run: |
          python3 preflight_check.py --no-fail || true

      - name: 抓取行情数据（LME）
        continue-on-error: true
        run: |
          python3 fetch_lme.py
          echo "--- lme_data.json 头部 ---"
          head -c 400 lme_data.json || echo "(未生成)"

      - name: 抓取新闻候选池
        run: |
          python3 fetch_news.py --report-date "${{ steps.date.outputs.report_date }}" --quiet

      - name: 汇总本轮产物
        # 2026-10-25 A06b：严格按 report_date 定位当日候选池。
        # 旧实现 glob+files[-1] 有两个坑：①残留历史文件时会统计到非报告日的池；
        # ②glob 通配会匹配 news_candidates_union_<date>.json，而字典序 'u'>'2'
        # 使 union 文件恒居 files[-1]——汇总的一直是并集池而非当日池。
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        run: |
          echo "=== 本轮产出文件 ==="
          ls -lh "data/news_candidates_${REPORT_DATE}.json" 2>/dev/null || echo "(无当日候选池)"
          ls -lh lme_data.json 2>/dev/null || echo "(无行情数据)"
          echo ""
          echo "=== 候选池条数 ==="
          python3 - <<'PY'
          import json, os
          D = os.environ['REPORT_DATE']
          p = 'data/news_candidates_%s.json' % D
          if not os.path.exists(p):
              print('当日候选池不存在：%s' % p)
              print('（抓取步骤未落盘——零产出也会写 status 文件，不存在即抓取步骤本身失败，请往上看日志）')
              raise SystemExit(0)
          d = json.load(open(p, encoding='utf-8'))
          st = d.get('status', 'ok')
          news = d.get('news', [])
          foreign = sum(1 for i in news if i.get('foreign'))
          print('%s：候选 %d 条（境外 %d 条）status=%s' % (os.path.basename(p), len(news), foreign, st))
          if st == 'failed':
              print('⚠️ status=failed：全部启用源抓取失败，这不是「当天无内容」')
          elif st == 'degraded':
              print('⚠️ status=degraded：部分源失败/疑似失败，当日零候选，需人工确认')
          elif st == 'empty':
              print('status=empty：所有源正常抓取，当天确实无新内容')
          PY

      - name: 信源产出报告
        # 2026-10-25 A06b：同上，按 report_date 精确选当日文件
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        run: |
          # 目的：识别在 GitHub（境外）服务器上哑掉的信源。
          # 连续多日零产出的源很可能是被墙 / 反爬 / 地域限流，而非「当天确实无内容」。
          # 源清单动态从 fetch_news.py 读取，不硬编码，避免源变更后报告失效。
          python3 - <<'PY'
          import json, glob, os, importlib.util

          # 1) 取启用中的源清单
          spec = importlib.util.spec_from_file_location('fn', 'fetch_news.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          all_src = {c['key']: c for c in m.SOURCES}
          enabled = {k: c for k, c in all_src.items() if c.get('enabled')}

          # 2) 统计本轮候选池（2026-10-25 A06b：按 report_date 定位，不再 glob+files[-1]）
          p = 'data/news_candidates_%s.json' % os.environ['REPORT_DATE']
          if not os.path.exists(p):
              print('当日候选池不存在：%s，无法统计' % p); raise SystemExit(0)
          pool = json.load(open(p, encoding='utf-8'))
          news = pool.get('news', [])
          st = pool.get('status', 'ok')
          if st != 'ok':
              print('（当日候选池 status=%s，news 为空属预期）' % st)

          got = {}
          for i in news:
              k = i.get('fetch_src', '?')
              got[k] = got.get(k, 0) + 1

          print()
          print('=== 本轮各信源产出 ===')
          print(f"{'KEY':<14}{'名称':<24}{'条数':>5}  {'境外':<4}")
          print('-' * 56)
          silent = []
          for k, c in sorted(enabled.items(), key=lambda x: -got.get(x[0], 0)):
              n = got.get(k, 0)
              flag = '是' if c.get('foreign') else ''
              mark = '' if n else '   ← 零产出'
              print(f"{k:<14}{c['name']:<24}{n:>5}  {flag:<4}{mark}")
              if n == 0:
                  silent.append((k, c['name']))

          print('-' * 56)
          print(f"启用源 {len(enabled)} 个 | 有产出 {len(enabled) - len(silent)} 个 "
                f"| 零产出 {len(silent)} 个")

          if silent:
              print()
              print('⚠️ 本轮零产出的源（需连续观察；若连续多日为 0，多半是境外服务器可达性问题）：')
              for k, name in silent:
                  print(f'   - {k}（{name}）')
          else:
              print()
              print('✅ 全部启用源均有产出')
          PY

      - name: Nightly 测试（Linux 跨平台验证，不阻断抓取）
        # 2026-10-25 D01：本 workflow 是「阶段一·只抓取」，从不生成页面/部署，
        # 测试红不会把坏代码带上线——那道闸门在本机 deploy_pages.py 的 QUICK_TESTS。
        # 这一步的价值是免费的 nightly CI：每天在 Linux 上跑一遍全量测试，
        # 专门暴露 Windows 本机发现不了的跨平台问题（CRLF / 路径 / 进程模型）。
        # continue-on-error：初期只观察不阻断，确认稳定后再考虑升级为硬门禁。
        # 依赖：node_modules 不入库（.gitignore），runner 上用 npm ci 按 lock 精确安装。
        continue-on-error: true
        run: |
          node --version
          python3 --version
          npm ci
          python3 run_tests_all.py --all --per-test 240 --budget 1500

      - name: 推送到 draft 分支
        run: |
          git config user.email "actions@github.com"
          git config user.name "mining-daily-bot"

          D="${{ steps.date.outputs.report_date }}"

          # 阶段一的范围刻意收得很窄：只留痕候选池。
          # - data/news_candidates_*.json：被 .gitignore 忽略（防止误入线上部署），
          #   用 -f 强制添加，让产物留痕在独立的 draft/fetch 分支上，两者不冲突。
          # - 刻意不提交 lme_data.json / lme-data.js / data/news_YYYY-MM.json：
          #   这些是业务数据，改写属生成环节的职责，阶段一只验证「抓取能否跑通」，
          #   不碰任何会影响线上的文件（即使 draft 分支已与线上隔离，仍保持最小面）。
          git add -f data/news_candidates_*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无新增内容，跳过提交"
            exit 0
          fi

          git commit -m "chore(fetch): $D 候选池（阶段一·自动）"

          # 推到一个专职的 draft 分支：与 main / gh-pages 完全隔离
          git push origin HEAD:refs/heads/draft/fetch --force

          echo "✅ 已推送到 draft/fetch 分支"
